<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ことば LINE · Japanese Studio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kotoba">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F7; --card:#FFFFFF; --ink:#1B2A4A; --ink-soft:#5B6883; --hairline:#E1E6EE;
  --line-h:#E5322D; --line-k:#0089A7; --line-v:#00A34A; --line-g:#F6A21D; --line-c:#8F3E97;
  --ok:#00A34A; --bad:#E5322D; --warn:#F6A21D;
  --radius:14px; --shadow:0 1px 3px rgba(27,42,74,.08),0 4px 14px rgba(27,42,74,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Zen Kaku Gothic New',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
#app{max-width:760px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
/* ---- station-sign header ---- */
.station{background:var(--ink);color:#fff;border-radius:0 0 var(--radius) var(--radius);padding:calc(18px + env(safe-area-inset-top)) 20px 0;margin:0 -14px 18px;box-shadow:var(--shadow)}
.station .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.station h1{font-weight:900;font-size:26px;letter-spacing:.06em}
.station h1 .lat{font-size:13px;font-weight:500;letter-spacing:.28em;opacity:.75;display:block}
.station .streak{font-size:13px;opacity:.9;text-align:right}
.station .strip{display:flex;height:8px;margin-top:14px;border-radius:8px 8px 0 0;overflow:hidden}
.station .strip span{flex:1}
.crumb{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font-size:14px;color:var(--ink-soft)}
.crumb button{color:var(--ink);font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;background:#fff;box-shadow:var(--shadow)}
/* ---- line map ---- */
.linemap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 6px 10px;margin-bottom:16px;overflow-x:auto}
.linemap h2{font-size:13px;letter-spacing:.18em;color:var(--ink-soft);padding:0 12px 8px;font-weight:700}
.track{display:flex;align-items:flex-start;min-width:640px;padding:6px 12px 4px}
.stn{flex:1;position:relative;text-align:center;min-width:44px}
.stn .seg{position:absolute;top:9px;left:-50%;width:100%;height:6px}
.stn:first-child .seg{display:none}
.stn .dot{position:relative;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--seg);margin:0 auto;z-index:1}
.stn.locked .dot{border-color:#C7CEDA;background:#EDF0F5}
.stn.done .dot{background:var(--seg)}
.stn.here .dot::after{content:"";position:absolute;inset:-9px;border:2px solid var(--seg);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.stn.here .dot::after{animation:none}}
.stn .lbl{font-size:11px;font-weight:700;margin-top:6px;line-height:1.25}
.stn.locked .lbl{color:#A7B0C0}
.stn .pct{font-size:10px;color:var(--ink-soft)}
/* ---- cards & modules ---- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.today{display:flex;align-items:center;justify-content:space-between;gap:12px}
.today .n{font-size:34px;font-weight:900;line-height:1}
.today .sub{font-size:13px;color:var(--ink-soft)}
.btn{display:inline-block;background:var(--ink);color:#fff;font-weight:700;padding:12px 20px;border-radius:10px;font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#EDF0F5;color:var(--ink)}
.btn.line{color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:left;position:relative;overflow:hidden;transition:transform .08s}
.mod:active{transform:scale(.98)}
.mod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--mc,var(--ink))}
.mod .jp{font-size:20px;font-weight:900}
.mod .en{font-size:13px;color:var(--ink-soft)}
.mod .tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;color:var(--ink-soft)}
.mod.locked{opacity:.55}
/* ---- quiz ---- */
.qwrap{text-align:center;padding:8px 0}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.prompt-jp{font-size:72px;font-weight:700;line-height:1.15;margin:10px 0}
.prompt-md{font-size:34px;font-weight:700;margin:10px 0}
.prompt-en{font-size:24px;font-weight:700;margin:14px 0}
.hintline{font-size:14px;color:var(--ink-soft);min-height:20px}
.ansrow{display:flex;gap:10px;justify-content:center;margin-top:16px}
.ansrow input{font-size:20px;padding:12px 14px;border:2px solid var(--hairline);border-radius:10px;width:min(340px,70%);text-align:center;background:#fff;color:var(--ink)}
.ansrow input:focus{outline:none;border-color:var(--ink)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.choices button{border:2px solid var(--hairline);border-radius:12px;padding:16px 10px;font-size:26px;font-weight:700;background:#fff;transition:transform .08s}
.choices button:active{transform:scale(.97)}
.choices button.en{font-size:17px}
.choices button.hit{border-color:var(--ok);background:#E9F7EE}
.choices button.miss{border-color:var(--bad);background:#FCEDEC}
.verdict{margin-top:16px;font-weight:900;font-size:18px;min-height:56px}
.verdict .good{color:var(--ok)}
.verdict .bad{color:var(--bad)}
.verdict .fix{font-size:15px;font-weight:500;color:var(--ink);margin-top:4px}
.speakbtn{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;font-size:26px;margin:8px auto;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.speakbtn.small{width:40px;height:40px;font-size:16px;display:inline-flex;margin:0}
.speakbtn.rec{background:var(--bad);animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{transform:scale(1.08)}}
.progressbar{height:6px;background:#EDF0F5;border-radius:6px;overflow:hidden;margin-bottom:14px}
.progressbar div{height:100%;background:var(--ink);transition:width .25s}
/* ---- tiles (sentence builder) ---- */
.tilezone{min-height:64px;border:2px dashed var(--hairline);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 14px;font-size:22px;font-weight:700;box-shadow:var(--shadow)}
.tile.used{opacity:.25;pointer-events:none}
/* ---- heatmap ---- */
.hm{display:grid;gap:4px;margin-top:10px}
.hm .cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:#EDF0F5;color:#8C96A8}
.cell.s1{background:#FADBD9;color:#B3261E}
.cell.s2{background:#FDEBC8;color:#9A6400}
.cell.s3{background:#CBEBD6;color:#0B6B33}
.cell.s4{background:#00A34A;color:#fff}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* ---- lessons ---- */
.lesson h3{font-size:22px;font-weight:900;margin-bottom:6px}
.lesson .body{font-size:15px;margin-bottom:10px}
.ex{display:flex;align-items:center;gap:10px;background:#F6F8FB;border-radius:10px;padding:10px 12px;margin:8px 0}
.ex .t{flex:1}
.ex .jp{font-size:20px;font-weight:700}
.ex .ro{font-size:13px;color:var(--ink-soft)}
.ex .en{font-size:14px}
/* ---- chat ---- */
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px 0 10px}
.msg{max-width:86%;padding:12px 14px;border-radius:14px;font-size:16px}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:4px}
.msg .jp{font-size:20px;font-weight:700}
.msg .ro{font-size:13px;color:var(--ink-soft);margin-top:2px}
.msg .en{font-size:14px;margin-top:4px}
.msg .note{font-size:13px;margin-top:6px;padding:8px 10px;background:#FFF6E4;border-radius:8px}
.chatrow{display:flex;gap:8px;margin-top:10px}
.chatrow input{flex:1;font-size:16px;padding:12px;border:2px solid var(--hairline);border-radius:10px;background:#fff;color:var(--ink)}
.small-note{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.banner{background:#FFF6E4;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.statrow{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:#F6F8FB;border-radius:10px;padding:12px;text-align:center}
.stat .n{font-size:26px;font-weight:900}
.stat .l{font-size:12px;color:var(--ink-soft)}
.conf-list{margin-top:10px}
.conf-list .ci{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--hairline);font-size:16px}
select,input[type=range]{font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--hairline);background:#fff;color:var(--ink);max-width:100%}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
h2.sec{font-size:15px;letter-spacing:.14em;color:var(--ink-soft);margin:18px 2px 10px;font-weight:700}
.endcard{text-align:center;padding:10px 0}
.endcard .big{font-size:44px;font-weight:900}
@media(max-width:520px){.grid{grid-template-columns:1fr}.prompt-jp{font-size:58px}}
</style>
</head>

function it(id){if(!S.items[id])S.items[id]={reps:0,lapses:0,c:0,w:0,int:0,ease:2.3,due:0,hist:[]};return S.items[id];}

const DAY=864e5;
function grade(id,correct){

  if(correct){x.c++;x.reps++;
    x.int=x.int===0?1:Math.round(x.int*x.ease*10)/10;
    x.ease=Math.min(2.8,x.ease+0.05);
    x.due=now+x.int*DAY;
  }else{x.w++;x.lapses++;
    x.int=0;x.ease=Math.max(1.3,x.ease-0.2);

function acc(x){const t=x.c+x.w;return t?x.c/t:0;}

function weightPick(ids,n){

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;

  const mix=shuffle([...fresh.slice(0,5),...weightPick(ids,7)]);
  const seen=new Set();const q=[];
  mix.forEach(id=>{if(!seen.has(id)&&q.length<12){seen.add(id);q.push(id);}});
  startSession(pickForms(q,{vocab:["jp2en","en2jp","hear2en"]}),STAGES.find(s=>s.id===st).full,"vocab");
}
/* ---- grammar ---- */
function showGrammarMenu(){
  app.innerHTML=header()+crumb("Grammar lessons")+`<div class="grid">`+
  GRAMMAR.map((g,i)=>{const st="G"+(i+1);const un=unlocked(st);const m=Math.round(stageMastery(st)*100);
   return mod("G"+(i+1),g.title.split("—")[1]||g.title,"var(--line-g)",`showLesson(${i})`,!un,m>=80?"✓":m+"%");}).join("")+`</div>`;
}
function showLesson(i){
  const g=GRAMMAR[i];
  app.innerHTML=header()+crumb("G"+(i+1))+
  `<div class="card lesson"><h3>${esc(g.title)}</h3><div class="body">${g.body}</div>`+
  g.ex.map(e=>`<div class="ex"><button class="speakbtn small" onclick="speak('${e[0]}')">▶</button>
   <div class="t"><div class="jp">${e[0]}</div><div class="ro mono">${esc(e[1])}</div><div class="en">${esc(e[2])}</div></div></div>`).join("")+
  `<div style="margin-top:14px"><button class="btn" onclick="startGrammarQuiz(${i})">Quiz me (${g.quiz.length} questions)</button></div></div>`;
}
function startGrammarQuiz(i){
  const g=GRAMMAR[i];
  startSession(shuffle(g.quiz.map((_,qi)=>({id:"g:"+g.id+":"+qi,form:"gq"}))),"G"+(i+1)+" quiz","grammar");
}
/* ---- sentence builder ---- */
function showSentenceMenu(){
  const maxG=Math.max(1,...Array.from({length:10},(_,i)=>i+1).filter(n=>unlocked("G"+n)));
  const avail=SENTENCES.map((s,i)=>({s,i})).filter(x=>x.s.g<=maxG);
  app.innerHTML=header()+crumb("Sentence builder")+
  `<div class="card"><p>${avail.length} of ${SENTENCES.length} sentences unlocked (grows with each grammar lesson you pass).</p>
   <div style="margin-top:12px"><button class="btn" onclick="startSentences()">Build 6 sentences</button></div></div>`;
}
function startSentences(){
  const maxG=Math.max(1,...Array.from({length:10},(_,i)=>i+1).filter(n=>unlocked("G"+n)));
  const avail=SENTENCES.map((s,i)=>"s:"+i).filter(id=>SENTENCES[ITEMS[id].s].g<=maxG);
  startSession(weightPick(avail,Math.min(6,avail.length)).map(id=>({id,form:"sb"})),"Sentence builder","sentence");
}
/* ---- placement ---- */
function startPlacement(){
  const ids=[...H1SET,...H2SET].map(([k])=>"h:"+k);
  let i=0,c=0;
  function next(){
    if(i>=ids.length)return done();
    const id=ids[i];const d=ITEMS[id];
    app.innerHTML=header()+crumb("Placement · hiragana")+
    `<div class="card"><div class="progressbar"><div style="width:${i/ids.length*100}%"></div></div>
     <div class="qmeta"><span>${i+1} / ${ids.length}</span><button class="btn ghost" style="padding:6px 12px;font-size:13px" id="stop">Finish early</button></div>
     <div class="qwrap"><div class="hintline">Type the romaji (or leave blank & check to skip)</div>
     <div class="prompt-jp">${d.kana}</div>
     <div class="ansrow"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="romaji…"></div>
     <div style="margin-top:12px"><button class="btn" id="chk">Check</button></div></div></div>`;
    const inp=document.getElementById("ans");inp.focus();
    const go=()=>{
      const v=inp.value.trim();
      if(v&&checkRomaji(v,d.ro)){c++;const x=it(id);x.reps=2;x.c=2;x.int=4;x.ease=2.4;x.due=Date.now()+4*DAY;x.hist=[1,1];}
      i++;save();next();
    };
    document.getElementById("chk").onclick=go;
    inp.onkeydown=e=>{if(e.key==="Enter")go();};
    document.getElementById("stop").onclick=done;
  }
  function done(){
    logSession(i,c,"placement");
    app.innerHTML=header()+crumb("Placement")+
    `<div class="card endcard"><div class="big">${c} / ${i}</div>
     <p>${c} characters seeded as known. They'll come back for confirmation in about 4 days. Everything you missed or skipped starts fresh in the drills.</p>
     <div style="margin-top:14px"><button class="btn" onclick="showHome()">To the line map</button></div></div>`;
  }
  next();
}
/* ---- speak & repeat ---- */
function showRepeat(){
  const lvlMax=unlocked("G3")?3:unlocked("V2")?2:1;
  const pool=PHRASES.map((p,i)=>({p,i})).filter(x=>x.p[3]<=lvlMax);
  let idx=0,results=[];
  function card(){
    if(idx>=Math.min(8,pool.length))return done();
    const {p,i}=pool[shufOrder[idx]];
    app.innerHTML=header()+crumb("Speak & repeat")+
    `<div class="card qwrap"><div class="qmeta"><span>${idx+1} / ${Math.min(8,pool.length)}</span><span>listen → say it back</span></div>
     <div class="prompt-md">${p[0]}</div><div class="hintline mono">${esc(p[1])}</div><div class="hintline">${esc(p[2])}</div>
     <div style="display:flex;gap:14px;justify-content:center;margin-top:10px">
       <button class="speakbtn" title="play" onclick="speak('${p[0]}')">▶</button>
       <button class="speakbtn" title="slow" onclick="speak('${p[0]}',0.6)">🐢</button>
       ${SRCls?`<button class="speakbtn" id="mic" title="record">🎤</button>`:""}
     </div>
     <div class="verdict" id="score"></div>
     <div id="selfgrade" style="margin-top:8px;${SRCls?"display:none":""}">
       <div class="hintline">${SRCls?"":"Speech recognition isn't available in this browser, so grade yourself honestly:"}</div>
       <div style="display:flex;gap:10px;justify-content:center;margin-top:8px">
        <button class="btn ghost" onclick="repGrade(${i},false)">Off</button>
        <button class="btn" onclick="repGrade(${i},true)">Nailed it</button></div>
     </div></div>`;
    speak(p[0]);
    if(SRCls){
      document.getElementById("mic").onclick=()=>{
        const btn=document.getElementById("mic");btn.classList.add("rec");
        const r=new SRCls();r.lang="ja-JP";r.interimResults=false;
        r.onresult=e=>{
          const heard=e.results[0][0].transcript;
          const sc=similarity(heard,p[0]);
          const pass=sc>=70;
          document.getElementById("score").innerHTML=
           `<div class="${pass?"good":"bad"}">${sc}% match ${pass?"✓":""}</div><div class="fix">Heard: 「${esc(heard)}」</div>
            <div style="margin-top:10px"><button class="btn" onclick="repGrade(${i},${pass})">${idx+1>=Math.min(8,pool.length)?"Finish":"Next →"}</button>
            <button class="btn ghost" onclick="document.getElementById('mic').click()">Retry 🎤</button></div>`;
          btn.classList.remove("rec");
        };
        r.onerror=ev=>{btn.classList.remove("rec");
          document.getElementById("score").innerHTML=`<div class="bad" style="font-size:14px">Mic unavailable (${esc(ev.error)}). Self-grade below.</div>`;
          document.getElementById("selfgrade").style.display="block";};
        r.onend=()=>btn.classList.remove("rec");
        r.start();
      };
    }
    window.repGrade=(pi,ok)=>{grade("p:"+pi,ok);results.push(ok);idx++;card();};
  }
  function done(){
    logSession(results.length,results.filter(Boolean).length,"repeat");
    app.innerHTML=header()+crumb("Speak & repeat")+
    `<div class="card endcard"><div class="big">${results.filter(Boolean).length}/${results.length}</div>
     <p>Pronunciation scoring is experimental. The slow 🐢 replay is the real teacher: shadow it out loud, rhythm first, speed later.</p>
     <div style="margin-top:14px"><button class="btn" onclick="showHome()">Home</button></div></div>`;
  }
  const shufOrder=shuffle(pool.map((_,i)=>i));
  card();
}
/* ================= DASHBOARD ================= */
function hmClass(id){const x=S.items[id];if(!x||x.reps+x.lapses===0)return"";const a=acc(x);
  if(known(id)&&x.int>=4)return"s4";if(known(id))return"s3";return a>=0.5?"s2":"s1";}
function heatGrid(rows,pre,cols){
  return `<div class="hm" style="grid-template-columns:repeat(${cols},1fr)">`+
   flatRows(rows).map(([k])=>`<div class="cell ${hmClass(pre+k)}" title="${k}">${k}</div>`).join("")+`</div>`;
}
function showDash(){
  const totalItems=Object.keys(ITEMS).filter(id=>ITEMS[id].type!=="phrase").length;
  const knownN=Object.keys(ITEMS).filter(id=>ITEMS[id].type!=="phrase"&&known(id)).length;
  const conf=Object.entries(S.confusions).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const last14={};S.sessions.forEach(s=>{last14[s.d]=(last14[s.d]||0)+s.n;});
  const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d.toISOString().slice(0,10);});
  const maxN=Math.max(1,...days.map(d=>last14[d]||0));
  app.innerHTML=header()+crumb("Dashboard")+
  `<div class="card"><div class="statrow">
    <div class="stat"><div class="n">${knownN}</div><div class="l">items known / ${totalItems}</div></div>
    <div class="stat"><div class="n">${dueIds().length}</div><div class="l">due now</div></div>
    <div class="stat"><div class="n">${streak()}</div><div class="l">day streak</div></div></div>
   <div style="display:flex;align-items:flex-end;gap:3px;height:52px;margin-top:16px">
    ${days.map(d=>`<div title="${d}" style="flex:1;background:${(last14[d]||0)?"var(--line-v)":"#EDF0F5"};height:${Math.max(8,(last14[d]||0)/maxN*100)}%;border-radius:3px"></div>`).join("")}</div>
   <div class="small-note">items answered, last 14 days</div></div>
  <div class="card"><h3 style="font-weight:900">ひらがな</h3>${heatGrid(HROWS,"h:",5)}
   <div style="margin-top:14px"><b style="font-size:14px">Dakuten & combos</b>
   <div class="hm" style="grid-template-columns:repeat(8,1fr)">${[...HDAK,...HCOMBO].map(([k])=>`<div class="cell ${hmClass("h:"+k)}" style="font-size:12px">${k}</div>`).join("")}</div></div>
   <div class="legend"><span><i style="background:#EDF0F5"></i>new</span><span><i style="background:#FADBD9"></i>weak</span><span><i style="background:#FDEBC8"></i>learning</span><span><i style="background:#CBEBD6"></i>known</span><span><i style="background:#00A34A"></i>solid</span></div></div>
  <div class="card"><h3 style="font-weight:900">カタカナ</h3>${heatGrid(KROWS,"k:",5)}</div>
  <div class="card"><h3 style="font-weight:900">Your confusion pairs</h3>
   ${conf.length?`<div class="conf-list">${conf.map(([k,n])=>`<div class="ci"><span>${k.replace("|","  ↔  ")}</span><span>${n}× mixed up</span></div>`).join("")}</div>
   <div style="margin-top:12px"><button class="btn" onclick="startConfusion()">Drill these</button></div>`
   :`<p style="color:var(--ink-soft);font-size:14px">No confusions logged yet. When you pick the wrong character in a multiple-choice drill, the pair lands here and feeds the confusion drills automatically.</p>`}
  </div>`;
}
/* ================= SETTINGS & RESET ================= */
function showSettings(){
  refreshVoices();
  app.innerHTML=header()+crumb("Audio & voice")+
  `<div class="card">
   <div class="setrow"><span>Speech speed</span><input type="range" min="0.5" max="1.2" step="0.05" value="${S.settings.rate}" id="rate"></div>
   <div class="setrow"><span>Japanese voice</span><select id="voice">${VOICES.length?VOICES.map(v=>`<option ${jaVoice()&&jaVoice().name===v.name?"selected":""}>${esc(v.name)}</option>`).join(""):`<option>No Japanese voice found on this device</option>`}</select></div>
   <div class="setrow"><span>Test</span><button class="btn ghost" onclick="speak('こんにちは、ジャスティンさん。にほんごをべんきょうしましょう。')">Play sample</button></div>
   <div class="setrow"><span>Anthropic API key<br><span style="font-size:12px;color:var(--ink-soft)">for conversation mode</span></span>
    <span>${apiKey()?`<span style="font-size:13px;color:var(--ok)">saved ✓</span> <button class="btn ghost" style="padding:8px 12px;font-size:13px" onclick="setApiKey('');showSettings()">Remove</button>`:`<button class="btn ghost" style="padding:8px 12px;font-size:13px" onclick="showConvo()">Add key</button>`}</span></div>
   <p class="small-note">If no Japanese voice appears: on iPhone/Mac, Settings → Accessibility → Spoken Content → Voices → Japanese, and download one (Kyoko is good). Chrome desktop ships Google 日本語 built in.</p></div>`;
  document.getElementById("rate").oninput=e=>{S.settings.rate=+e.target.value;save();};
  document.getElementById("rate").onchange=()=>speak("こんにちは");
  document.getElementById("voice").onchange=e=>{S.settings.voice=e.target.value;save();speak("こんにちは");};
}
function showReset(){
  app.innerHTML=header()+crumb("Placement / reset")+
  `<div class="card"><p><b>Re-run placement</b> — re-seed what you already know (safe, only upgrades items).</p>
   <div style="margin:10px 0 18px"><button class="btn" onclick="startPlacement()">Run placement</button></div>
   <p><b>Full reset</b> — wipes all progress, confusions, and history. No backup, no undo.</p>
   <div style="margin-top:10px"><button class="btn" style="background:var(--bad)" onclick="fullReset()">Erase everything</button></div></div>`;
}
function fullReset(){
  if(!confirm("Erase all progress? This cannot be undone."))return;
  S={version:1,items:{},confusions:{},sessions:[],settings:S.settings,lastConvo:[]};
  try{localStorage.setItem("kotoba-state",JSON.stringify(S));}catch(e){}
  showHome();
}
/* ================= CONVERSATION (Claude) ================= */
function knownVocabList(){
  return Object.keys(ITEMS).filter(id=>id.startsWith("v:")&&known(id)).map(id=>ITEMS[id].kana).slice(0,120);
}
function convoSystem(){
  const gN=Array.from({length:10},(_,i)=>i+1).filter(n=>stageMastery("G"+n)>=MASTERY_GATE).length;
  return `You are a Japanese conversation partner inside a learning app. The learner is Justin, a beginner.
STRICT RULES:
- Use ONLY hiragana and katakana. Absolutely no kanji.
- Keep each Japanese sentence short (max ~10 words). One or two sentences per turn, then ask him a simple question back.
- His level: knows grammar lessons G1 through G${Math.max(1,gN)} (topics: wa/desu, ka questions, no, o+verb, ni/de, ga, adjectives, negatives, past, tai/kudasai — only the first ${Math.max(1,gN)} of these). Stay inside that grammar.
- Prefer words from his known vocabulary: ${knownVocabList().join("、")||"(none yet — use only the most common beginner words)"}
- If his Japanese has a mistake, gently correct it in the NOTE line. If it is fine, NOTE can be omitted.
- Reply in EXACTLY this format, nothing else:
JP: (Japanese, kana only)
RO: (romaji)
EN: (English translation)
NOTE: (optional, one short English coaching note or correction)`;
}
function apiKey(){try{return localStorage.getItem("kotoba-api-key")||"";}catch(e){return"";}}
function setApiKey(k){try{localStorage.setItem("kotoba-api-key",k.trim());}catch(e){}}
function renderConvo(busy){
  if(!apiKey()){
    app.innerHTML=header()+crumb("Conversation")+
    `<div class="card"><h3 style="font-weight:900;margin-bottom:8px">Connect Claude</h3>
     <p style="font-size:14.5px">Conversation mode calls the Anthropic API directly from your browser. Paste an API key from <span class="mono">console.anthropic.com</span>. It's stored only in this browser's localStorage — it never goes into the repo or to any server other than Anthropic's.</p>
     <div class="chatrow" style="margin-top:12px"><input id="keyin" type="password" placeholder="sk-ant-…">
      <button class="btn" id="keysave">Save</button></div>
     <p class="small-note">Usage is billed to your key. A short chat costs well under a cent.</p></div>`;
    document.getElementById("keysave").onclick=()=>{const v=document.getElementById("keyin").value.trim();if(v){setApiKey(v);renderConvo(false);}};
    return;
  }
  app.innerHTML=header()+crumb("Conversation")+
  `<div class="card">
   ${S.lastConvo.length?"":`<p class="small-note" style="margin-bottom:10px">Claude speaks at your exact level (it knows which grammar you've passed and which words you know). Reply in Japanese — romaji or kana both work. Say こんにちは to start.</p>`}
   <div class="chat" id="chat">${S.lastConvo.map(m=>m.role==="user"
     ?`<div class="msg me">${esc(m.text)}</div>`
     :`<div class="msg ai">${m.jp?`<div style="display:flex;gap:8px;align-items:center"><button class="speakbtn small" onclick="speak('${m.jp.replace(/['"\\\\]/g,"")}')">▶</button><div class="jp">${esc(m.jp)}</div></div>`:""}
        ${m.ro?`<div class="ro mono">${esc(m.ro)}</div>`:""}${m.en?`<div class="en">${esc(m.en)}</div>`:""}
        ${m.note?`<div class="note">📝 ${esc(m.note)}</div>`:""}${m.raw?`<div class="en">${esc(m.raw)}</div>`:""}</div>`).join("")}
    ${busy?`<div class="msg ai" style="color:var(--ink-soft)">…</div>`:""}</div>
   <div class="chatrow"><input id="ci" placeholder="Type in Japanese (romaji ok)…" ${busy?"disabled":""}>
    <button class="btn" id="send" ${busy?"disabled":""}>Send</button></div>
   <div style="margin-top:8px;display:flex;gap:8px">
    <button class="btn ghost" style="font-size:13px;padding:8px 12px" onclick="S.lastConvo=[];save();renderConvo()">New conversation</button></div></div>`;
  const chat=document.getElementById("chat");chat.scrollTop=chat.scrollHeight;
  const inp=document.getElementById("ci");
  if(!busy){const go=()=>{if(inp.value.trim())sendConvo(inp.value.trim());};
   document.getElementById("send").onclick=go;
   inp.onkeydown=e=>{if(e.key==="Enter")go();};inp.focus();}
}
function parseConvo(text){
  const g=k=>{const m=text.match(new RegExp("^"+k+":\\s*(.+)$","m"));return m?m[1].trim():"";};
  const jp=g("JP"),ro=g("RO"),en=g("EN"),note=g("NOTE");
  if(!jp&&!en)return{raw:text};
  return{jp,ro,en,note};
}
async function sendConvo(text){
  S.lastConvo.push({role:"user",text});
  while(S.lastConvo.length>40||S.lastConvo[0].role!=="user")S.lastConvo.shift();
  save();renderConvo(true);
  try{
    const msgs=S.lastConvo.map(m=>m.role==="user"
      ?{role:"user",content:m.text}
      :{role:"assistant",content:`JP: ${m.jp||""}\nRO: ${m.ro||""}\nEN: ${m.en||""}`+(m.note?`\nNOTE: ${m.note}`:"")});
    msgs[0]={role:"user",content:convoSystem()+"\n\nLearner says: "+msgs[0].content};
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
        "Content-Type":"application/json",
        "x-api-key":apiKey(),
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:msgs})});
    if(resp.status===401){
      setApiKey("");
      S.lastConvo.push({role:"ai",raw:"That API key was rejected (401). Enter it again."});
      renderConvo(false);return;
    }
    const data=await resp.json();
    const full=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const parsed=parseConvo(full||"(no reply — try again)");
    S.lastConvo.push({role:"ai",...parsed});save();
    renderConvo(false);
    if(parsed.jp)speak(parsed.jp);
  }catch(e){
    S.lastConvo.push({role:"ai",raw:"Connection problem — that message didn't go through. Send it again."});
    renderConvo(false);
  }
}
function showConvo(){renderConvo(false);}
/* ================= INIT ================= */
loadState();
showHome();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
